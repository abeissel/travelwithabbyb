<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel with Abby B</title>
    <style>
        /* Reset and Full Screen Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Top Center Section (Logo + Stretched Title) */
        .center-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            z-index: 10;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 8px;
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
        }

        /* Left-Side Content & Message */
        .left-content {
            position: absolute;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 270px;
            z-index: 10;
        }

        .left-message {
            background: transparent;
            color: #ffffff;
            padding: 0;
            font-size: 18px;
            line-height: 1.5;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
        }

        /* Right-Side Buttons */
        .right-buttons {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        /* General Button Styling */
        .btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Bottom Affiliate Picture Boxes - Large */
        .affiliate-footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
            z-index: 10;
        }

        .affiliate-box {
            width: 240px;
            height: 120px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #007bff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            overflow: hidden;
            padding: 8px;
        }

        .affiliate-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* =======================================================
           MOBILE RESPONSIVE STYLES (Triggers automatically on phones)
           ======================================================= */
        @media screen and (max-width: 900px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto; /* Allows scrolling on mobile */
                padding: 20px 15px 40px 15px;
            }

            /* Disable absolute positioning on mobile so elements stack cleanly */
            .center-container, .left-content, .right-buttons, .affiliate-footer {
                position: static;
                transform: none;
                width: 100%;
                max-width: 100%;
                margin-bottom: 20px;
            }

            /* Order 1: Logo & Title at the very top */
            .center-container {
                margin-top: 10px;
                margin-bottom: 25px;
            }

            .logo {
                width: 130px; /* Perfectly sized for phone screens */
            }

            .title {
                font-size: 24px;
                letter-spacing: 1px;
            }

            /* Order 2: Message & Quote Button with a readable semi-transparent background box */
            .left-content {
                background: rgba(0, 0, 0, 0.65);
                padding: 20px;
                border-radius: 10px;
                text-align: center;
                margin-bottom: 25px;
            }

            .left-message {
                font-size: 16px;
                margin-bottom: 15px;
            }

            /* Order 3: Action Buttons (Full width for easy tapping) */
            .right-buttons {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-bottom: 25px;
            }

            .btn {
                width: 100%;
                padding: 14px;
                font-size: 16px;
            }

            /* Order 4: Affiliate Boxes stacked neatly two-by-two */
            .affiliate-footer {
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
            }

            .affiliate-box {
                width: 48%; /* Fits two side-by-side cleanly */
                height: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- Left-Hand Side Content & Message -->
    <div class="left-content">
        <div class="left-message">
            Ready to set sail? Explore our exclusive cruise packages and special offers. Ask about our all-inclusive resorts.
        </div>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScmWA3gwEhbjbqobIGya7RzIcihCsi9DrsDyzGvwAm7X4e9Hw/viewform?usp=header" target="_blank" class="btn">Get a Quote</a>
    </div>

    <!-- Top Center Section: Larger Logo & Stretched Title -->
    <div class="center-container">
        <img src="images/logo.jpg" alt="Logo" class="logo">
        <div class="title">Travel with Abby B</div>
    </div>

    <!-- Right-Side Buttons -->
    <div class="right-buttons">
        <a href="https://m.me/AbbyLuxevoVacations" target="_blank" class="btn">Message Us</a>
        <a href="tel:7408194345" class="btn">Call Us</a>
        <a href="https://www.facebook.com/AbbyLuxevoVacations" target="_blank" class="btn">Find us on Facebook</a>
    </div>

    <!-- Bottom Affiliate Picture Boxes -->
    <div class="affiliate-footer">
        <div class="affiliate-box">
            <img src="images/CCL_LOGO_CMYK_R_2026_COLOR.jpg" alt="Affiliate 1">
        </div>
        <div class="affiliate-box">Affiliate 2</div>
        <div class="affiliate-box">Affiliate 3</div>
        <div class="affiliate-box">Affiliate 4</div>
    </div>

</body>
</html>
