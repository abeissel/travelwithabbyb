<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel with Abby B</title>
    <style>
        /* Reset and Full Screen Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Top Center Section (Logo + Stretched Title) */
        .center-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
        }

        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 5px;
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
        }

        /* Left-Side Content & Message */
        .left-content {
            position: absolute;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 250px;
        }

        .left-message {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Right-Side Buttons */
        .right-buttons {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* General Button Styling */
        .btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Bottom Affiliate Picture Boxes - Made Larger */
        .affiliate-footer {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
        }

        .affiliate-box {
            width: 180px; /* Increased width */
            height: 90px; /* Increased height */
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #007bff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #333;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 5px;
        }

        .affiliate-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures logos fit neatly without getting cut off */
        }
    </style>
</head>
<body>

    <!-- Left-Hand Side Content & Message -->
    <div class="left-content">
        <div class="left-message">
            Welcome to Travel with Abby B! Explore our cruise packages and special offers.
        </div>
        <a href="#" class="btn">Menu / Links</a>
    </div>

    <!-- Top Center Section: Logo & Stretched Title -->
    <div class="center-container">
        <img src="images/logo.jpg" alt="Logo" class="logo">
        <div class="title">Travel with Abby B</div>
    </div>

    <!-- Right-Hand Side Buttons -->
    <div class="right-buttons">
        <a href="#" class="btn">Message Us</a>
        <a href="tel:+1234567890" class="btn">Call Us</a>
        <a href="https://facebook.com" target="_blank" class="btn">Facebook</a>
    </div>

    <!-- Bottom Affiliate Picture Boxes (Larger) -->
    <div class="affiliate-footer">
        <!-- Example using your Carnival logo file: -->
        <div class="affiliate-box">
            <img src="images/CCL_LOGO_CMYK_R_2026_COLOR.jpg" alt="Affiliate 1">
        </div>
        <div class="affiliate-box">Affiliate 2</div>
        <div class="affiliate-box">Affiliate 3</div>
        <div class="affiliate-box">Affiliate 4</div>
    </div>

</body>
</html>
