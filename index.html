<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel with Abby B</title>
    <style>
        /* Reset and Full Screen Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Top Center Section (Logo + Stretched Title) */
        .center-container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            z-index: 10;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 8px;
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
        }

        /* Middle Section Container (Desktop Side-by-Side) */
        .middle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin: auto 0;
            padding: 0 20px;
            z-index: 10;
        }

        /* Left-Side Content & Message */
        .left-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
        }

        .left-message {
            background: transparent;
            color: #ffffff;
            padding: 0;
            font-size: 18px;
            line-height: 1.5;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
        }

        /* Right-Side Buttons */
        .right-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 200px;
        }

        /* General Button Styling */
        .btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Bottom Affiliate Picture Boxes - Large */
        .affiliate-footer {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 10px;
            z-index: 10;
        }

        .affiliate-box {
            width: 220px;
            height: 110px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #007bff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            overflow: hidden;
            padding: 8px;
        }

        .affiliate-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* =======================================================
           MOBILE RESPONSIVE STYLES (Screens under 900px)
           ======================================================= */
        @media screen and (max-width: 900px) {
            body {
                height: auto;
                min-height: 100vh;
                justify-content: flex-start;
                gap: 25px;
                padding: 20px 15px;
            }

            .center-container {
                margin-top: 10px;
            }

            .logo {
                width: 130px;
            }

            .title {
                font-size: 24px;
                letter-spacing: 1px;
            }

            /* Stack the middle items vertically on phones */
            .middle-container {
                flex-direction: column;
                gap: 25px;
                padding: 0;
                margin: 0;
                width: 100%;
            }

            .left-content {
                max-width: 100%;
                width: 100%;
                background: rgba(0, 0, 0, 0.65); /* Clean box background for mobile readability */
                padding: 20px;
                border-radius: 10px;
                text-align: center;
            }

            .left-message {
                font-size: 16px;
                margin-bottom: 15px;
            }

            .right-buttons {
                width: 100%;
            }

            .btn {
                width: 100%;
                padding: 14px;
                font-size: 16px;
            }

            /* Stack or grid the affiliate boxes nicely on smaller screens */
            .affiliate-footer {
                flex-wrap: wrap;
                gap: 12px;
                margin-top: 5px;
            }

            .affiliate-box {
                width: 48%;
                height: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Center Section: Larger Logo & Stretched Title -->
    <div class="center-container">
        <img src="images/logo.jpg" alt="Logo" class="logo">
        <div class="title">Travel with Abby B</div>
    </div>

    <!-- Middle Section (Message & Contact Buttons) -->
    <div class="middle-container">
        <!-- Left-Hand Side Content & Message -->
        <div class="left-content">
            <div class="left-message">
                Ready to set sail? Explore our exclusive cruise packages and special offers. Ask about our all-inclusive resorts.
            </div>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScmWA3gwEhbjbqobIGya7RzIcihCsi9DrsDyzGvwAm7X4e9Hw/viewform?usp=header" target="_blank" class="btn">Get a Quote</a>
        </div>

        <!-- Right-Side Buttons -->
        <div class="right-buttons">
            <a href="https://m.me/AbbyLuxevoVacations" target="_blank" class="btn">Message Us</a>
            <a href="tel:7408194345" class="btn">Call Us</a>
            <a href="https://www.facebook.com/AbbyLuxevoVacations" target="_blank" class="btn">Find us on Facebook</a>
        </div>
    </div>

    <!-- Bottom Affiliate Picture Boxes -->
    <div class="affiliate-footer">
        <div class="affiliate-box">
            <img src="images/CCL_LOGO_CMYK_R_2026_COLOR.jpg" alt="Affiliate 1">
        </div>
        <div class="affiliate-box">Affiliate 2</div>
        <div class="affiliate-box">Affiliate 3</div>
        <div class="affiliate-box">Affiliate 4</div>
    </div>

</body>
</html>
