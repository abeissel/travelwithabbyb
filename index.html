<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel with Abby B</title>
    <style>
        /* Reset and Full Screen Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            /* Optional: You can use your background.jpg here if you want! */
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-color: #f4f4f9; 
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Center Section (Logo + Title) */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .logo {
            width: 150px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 10px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        /* Right-Side Buttons */
        .right-buttons {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Left-Side Content */
        .left-content {
            position: absolute;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            max-width: 250px;
        }
    </style>
</head>
<body>

    <!-- Left-Hand Side Content -->
    <div class="left-content">
        <p>This is your left-hand side content. You can put text, links, or a menu here.</p>
    </div>

    <!-- Center Section: Logo & Title -->
    <div class="center-container">
        <!-- Updated to point to 'images/logo.jpg' -->
        <img src="images/logo.jpg" alt="Logo" class="logo">
        <div class="title">Travel with Abby B</div>
    </div>

    <!-- Right-Hand Side Buttons -->
    <div class="right-buttons">
        <a href="#" class="btn">Message Us</a>
        <a href="tel:+1234567890" class="btn">Call Us</a>
        <a href="https://facebook.com" target="_blank" class="btn">Facebook</a>
    </div>

</body>
</html>
