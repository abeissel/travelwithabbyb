<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel with Abby B</title>
    <style>
        /* Reset and Full Screen Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Top Center Section (Logo + Title) */
        .center-container {
            position: absolute;
            top: 20px; /* Positioned near the top */
            left: 50%;
            transform: translateX(-50%); /* Centers it horizontally */
            text-align: center;
        }

        .logo {
            width: 120px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 5px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff; /* White text for contrast */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8); /* Shadow makes it readable */
        }

        /* Right-Side Buttons */
        .right-buttons {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Left-Side Content & Button */
        .left-content {
            position: absolute;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 250px;
        }

        /* General Button Styling */
        .btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Left-Hand Side Content & Button -->
    <div class="left-content">
        <a href="#" class="btn">Menu / Links</a>
        <!-- You can add extra text here if needed -->
    </div>

    <!-- Top Center Section: Logo & Title -->
    <div class="center-container">
        <img src="images/logo.jpg" alt="Logo" class="logo">
        <div class="title">Travel with Abby B</div>
    </div>

    <!-- Right-Hand Side Buttons -->
    <div class="right-buttons">
        <a href="#" class="btn">Message Us</a>
        <a href="tel:+1234567890" class="btn">Call Us</a>
        <a href="https://facebook.com" target="_blank" class="btn">Facebook</a>
    </div>

</body>
</html>
