<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel with Abby B</title>
    <style>
        /* Reset and Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            min-height: 100vh;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Top Center Section (Logo + Title) */
        .center-container {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            max-width: 800px;
            z-index: 10;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 8px;
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
        }

        /* Top Left Corner Affiliate Box (Box 1) */
        .top-left-corner {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
        }

        /* Top Right Corner Affiliate Box (Box 2) */
        .top-right-corner {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 10;
        }

        /* Middle Left-Side Content & Message */
        .left-content {
            position: absolute;
            top: 55%;
            left: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            z-index: 10;
        }

        .left-message {
            background: transparent;
            color: #ffffff;
            padding: 0;
            font-size: 18px;
            line-height: 1.5;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
        }

        /* Middle Right-Side Buttons */
        .right-buttons {
            position: absolute;
            top: 55%;
            right: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 200px;
            z-index: 10;
        }

        /* General Button Styling */
        .btn {
            padding: 14px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Universal 200x200 Affiliate Box Styling */
        .affiliate-box {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #007bff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #333;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            overflow: hidden;
            padding: 6px;
            text-decoration: none;
        }

        .affiliate-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Bottom Row Affiliate Footer (4 Boxes Across) */
        .affiliate-footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 950px;
            z-index: 10;
            padding: 0 10px;
        }

        /* =======================================================
           MOBILE RESPONSIVE STYLES (Screens under 768px)
           ======================================================= */
        @media screen and (max-width: 768px) {
            html, body {
                height: auto;
                min-height: 100vh;
                overflow-x: hidden;
                overflow-y: auto;
            }

            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px 15px 40px 15px;
            }

            .center-container, .top-left-corner, .top-right-corner, .left-content, .right-buttons, .affiliate-footer {
                position: static;
                transform: none;
                width: 100%;
                max-width: 100%;
                margin: 0 0 20px 0;
            }

            .center-container {
                order: 1;
                margin-top: 5px;
                margin-bottom: 20px;
            }

            .logo {
                width: 120px;
            }

            .title {
                font-size: 20px;
                letter-spacing: 1px;
            }

            .left-content {
                order: 2;
                background: rgba(0, 0, 0, 0.75);
                padding: 18px;
                border-radius: 10px;
                text-align: center;
                box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            }

            .left-message {
                font-size: 15px;
                margin-bottom: 12px;
                text-shadow: none;
            }

            .right-buttons {
                order: 3;
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }

            .btn {
                width: 100%;
                padding: 12px;
                font-size: 15px;
            }

            .top-left-corner, .top-right-corner {
                display: flex;
            }

            .affiliate-footer {
                order: 4;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
                margin-top: 10px;
            }

            .affiliate-box, .top-left-corner, .top-right-corner {
                width: 47% !important;
                height: 150px !important;
            }
        }
    </style>
</head>
<body>

    <!-- Upper Left Corner Affiliate Box (Unlinked Display Only) -->
    <div class="affiliate-box top-left-corner">
        <img src="images/beaches-fall-jam.jpg.jpg" alt="Beaches Fall Fam Jam">
    </div>

    <!-- Upper Right Corner Affiliate Box (Unlinked Norwegian Map) -->
    <div class="affiliate-box top-right-corner">
        <img src="images/norwegian-map.jpg.jpeg" alt="Norwegian Itinerary Map">
    </div>

    <!-- Left-Hand Side Content & Message -->
    <div class="left-content">
        <div class="left-message">
            Ready to set sail? Explore our exclusive cruise packages and special offers. Ask about our all-inclusive resorts.
        </div>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScmWA3gwEhbjbqobIGya7RzIcihCsi9DrsDyzGvwAm7X4e9Hw/viewform?usp=header" target="_blank" class="btn">Get a Quote</a>
    </div>

    <!-- Top Center Section: Logo & Title -->
    <div class="center-container">
        <img src="images/logo.jpg" alt="Logo" class="logo">
        <div class="title">Travel with Abby B</div>
    </div>

    <!-- Right-Side Buttons -->
    <div class="right-buttons">
        <a href="https://m.me/AbbyLuxevoVacations" target="_blank" class="btn">Message Us</a>
        <a href="tel:7408914345" class="btn">Call Us</a>
        <a href="https://www.facebook.com/AbbyLuxevoVacations" target="_blank" class="btn">Find us on Facebook</a>
    </div>

    <!-- Bottom Row Affiliate Picture Boxes (4 Boxes Across, 200x200) -->
    <div class="affiliate-footer">
        <!-- Box 3 (Sandals - Linked) -->
        <a href="https://www.sandals.com/south-coast/photos/?referral=101355&agentid=ANBE8809" target="_blank" class="affiliate-box">
            <img src="images/CCL_LOGO_CMYK_R_2026_COLOR.jpg" alt="Sandals">
        </a>
        <!-- Box 4 (Unlinked Display Only) -->
        <div class="affiliate-box">
            <img src="images/affiliate4.jpg" alt="Affiliate 4">
        </div>
        <!-- Box 5 (Margaritaville at Sea Islander - Unlinked Display Only) -->
        <div class="affiliate-box">
            <img src="images/margaritaville-islander.png.png" alt="Margaritaville at Sea Islander">
        </div>
        <!-- Box 6 (Unlinked Display Only) -->
        <div class="affiliate-box">
            <img src="images/affiliate6.jpg" alt="Affiliate 6">
        </div>
    </div>

</body>
</html>
