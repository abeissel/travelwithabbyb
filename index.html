<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel with Abby B</title>
    <style>
        /* Reset and Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            min-height: 100vh;
        }

        /* Top Center Section (Logo + Stretched Title) */
        .center-container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 10px;
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
        }

        /* Middle Section Container (Desktop Side-by-Side) */
        .middle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1050px; /* Slightly widened container to push right side further out */
            margin: 20px 0;
            padding: 0 15px;
        }

        /* Left-Side Content & Message */
        .left-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 320px;
        }

        .left-message {
            background: transparent;
            color: #ffffff;
            padding: 0;
            font-size: 18px;
            line-height: 1.5;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
        }

        /* Right-Side Buttons - Nudged further right */
        .right-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 220px;
            margin-right: -10px; /* Shifts the button group further toward the right edge */
        }

        /* General Button Styling */
        .btn {
            padding: 14px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Bottom Affiliate Picture Boxes - Original Wide Format */
        .affiliate-footer {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }

        .affiliate-box {
            width: 220px;
            height: 110px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #007bff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            overflow: hidden;
            padding: 8px;
        }

        .affiliate-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* =======================================================
           MOBILE RESPONSIVE STYLES (Screens under 768px)
           ======================================================= */
        @media screen and (max-width: 768px) {
            body {
                padding: 20px 15px;
                justify-content: flex-start;
                gap: 20px;
            }

            .center-container {
                margin-bottom: 10px;
            }

            .logo {
                width: 130px;
            }

            .title {
                font-size: 22px;
                letter-spacing: 1px;
            }

            .middle-container {
                flex-direction: column;
                gap: 20px;
                margin: 0;
                width: 100%;
                padding: 0;
            }

            .left-content {
                max-width: 100%;
                width: 100%;
                background: rgba(0, 0, 0, 0.7);
                padding: 20px;
                border-radius: 10px;
                text-align: center;
            }

            .left-message {
                font-size: 16px;
                margin-bottom: 12px;
                text-shadow: none;
            }

            .right-buttons {
                width: 100%;
                margin-right: 0; /* Resets the right shift for mobile centering */
            }

            .btn {
                width: 100%;
                padding: 14px;
                font-size: 16px;
            }

            .affiliate-footer {
                flex-wrap: wrap;
                gap: 12px;
                margin-top: 10px;
            }

            .affiliate-box {
                width: 48%;
                height: 85px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Center Section: Logo & Title -->
    <div class="center-container">
        <img src="images/logo.jpg" alt="Logo" class="logo">
        <div class="title">Travel with Abby B</div>
    </div>

    <!-- Middle Section (Message, Quote Button, & Social Buttons) -->
    <div class="middle-container">
        <div class="left-content">
            <div class="left-message">
                Ready to set sail? Explore our exclusive cruise packages and special offers. Ask about our all-inclusive resorts.
            </div>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScmWA3gwEhbjbqobIGya7RzIcihCsi9DrsDyzGvwAm7X4e9Hw/viewform?usp=header" target="_blank" class="btn">Get a Quote</a>
        </div>

        <div class="right-buttons">
            <a href="https://m.me/AbbyLuxevoVacations" target="_blank" class="btn">Message Us</a>
            <a href="tel:7408194345" class="btn">Call Us</a>
            <a href="https://www.facebook.com/AbbyLuxevoVacations" target="_blank" class="btn">Find us on Facebook</a>
        </div>
    </div>

    <!-- Bottom Affiliate Picture Boxes -->
    <div class="affiliate-footer">
        <div class="affiliate-box">
            <img src="images/CCL_LOGO_CMYK_R_2026_COLOR.jpg" alt="Affiliate 1">
        </div>
        <div class="affiliate-box">Affiliate 2</div>
        <div class="affiliate-box">Affiliate 3</div>
        <div class="affiliate-box">Affiliate 4</div>
    </div>

</body>
</html>
