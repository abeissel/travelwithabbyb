<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel With Abby B</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>

    <main class="container">
        <!-- Logo -->
        <img src="images/logo.jpg" alt="Travel With Abby B Logo" class="site-logo">

        <!-- Title & Subtitle -->
        <h1>Travel With Abby B</h1>
        <p class="subtitle">Your personal travel advisor specializing in custom getaways, all-inclusive resorts, and unforgettable cruise experiences.</p>

        <!-- Call to Action Section -->
        <div class="cta-section">
            <p class="cta-text">Ready to map out your dream trip? Takes less than 2 minutes!</p>
            <a href="YOUR_GOOGLE_FORM_LINK_HERE" class="btn" target="_blank">Request a Custom Quote</a>
        </div>
    </main>

    <!-- Floating Supplier Cards in the Bottom Corners -->
    <div class="supplier-corner-left">
        <img src="images/carnival.jpg" alt="Cruise Line Partner">
        <span>Major Cruise Lines</span>
    </div>

    <div class="supplier-corner-right">
        <img src="images/resort.jpg" alt="All-Inclusive Resort">
        <span>All-Inclusive Resorts</span>
    </div>

</body>
</html>
